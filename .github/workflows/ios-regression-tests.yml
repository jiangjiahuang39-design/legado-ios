name: iOS Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Book Library Regression Tests
    runs-on: macos-26-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Run BookLibraryRegressionTests
        run: |
          set -o pipefail
          swift test --filter BookLibraryRegressionTests 2>&1 | tee "$RUNNER_TEMP/BookLibraryRegressionTests.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BookLibraryRegressionTests-Log
          path: ${{ runner.temp }}/BookLibraryRegressionTests.log
          if-no-files-found: ignore
          retention-days: 7
